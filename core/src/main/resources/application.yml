spring:
  application:
    name: esg-management-system

  # ── 데이터소스 (공통 기본값 / 모듈별 override 가능) ────────────────────────
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url:      ${DB_URL:jdbc:mariadb://localhost:3306/esg_db?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:esg_user}
    password: ${DB_PASSWORD:esg_pass}
    hikari:
      pool-name: HikariCP-Main
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ──────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none          # DDL 자동 생성 비활성화 (요구사항)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false

  # ── 메시지 ────────────────────────────────────────────────────────────────
  messages:
    basename: messages
    encoding: UTF-8

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:esg-management-system-jwt-secret-key-must-be-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

# ── 서버 ──────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# ── 로깅 ──────────────────────────────────────────────────────────────────────
logging:
  level:
    root:                               INFO
    com.company:                        DEBUG
    org.springframework.security:       WARN
    org.hibernate.SQL:                  DEBUG
    org.hibernate.type.descriptor.sql:  TRACE

---
# ── 개발 프로파일 ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mariadb://localhost:3306/esg_db?characterEncoding=UTF-8&serverTimezone=Asia/Seoul

  jpa:
    show-sql: true

---
# ── 테스트 프로파일 ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시에만 자동생성 허용
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
