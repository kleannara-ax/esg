# module-esgindicator 테스트 프로파일
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:esi_testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# JWT 테스트용 (임의값)
jwt:
  secret: test-secret-key-for-esgindicator-module-at-least-32-characters
  expiration-ms: 3600000

logging:
  level:
    com.company.module.esgindicator: DEBUG
    org.hibernate.SQL: DEBUG
